# RAG26 Arena: RAGDoll/TREC RAG 2026-style pairwise preference judge (SPARROW-ranked).
judge_class: "judges.rag26_arena.judge:RAG26ArenaJudge"

create_nuggets: false
create_qrels: false
judge: true
uses_llm: true

settings:
  filebase: "rag26-arena"

judge_settings:
  full_round_robin_max_candidates: 5
  initial_graph_degree: 4
  adaptive_comparisons_per_topic: 4
  top_k: 1
  position_reversal_budget: 2
  exact_kemeny_limit: 8
  arena_max_answer_chars: 2000
  judge_weight: 1.0
  llm_max_attempts: 3
  llm_retry_backoff_seconds: 0.25
  citation_support_enabled: false
  support_batch_size: 10
  support_max_doc_chars: 1500
  rubric_arena_enabled: false
  rubric_path: "rubrics/frozen/rag26-rubrics.jsonl"

variants:
  # Baseline: identical to the default settings above, named for
  # docs/rag26-tira-submission-plan.md's `--variant arena-only` commands.
  arena-only: {}
  # Arena ranking plus the independent citation-support lane (plan Phase 3).
  # A stepping stone toward the `rubric-support-arena` variant named in
  # docs/trec-rag-2026-judge-implementation-plan.md Section 14.3, which
  # additionally needs the not-yet-built rubric lane.
  arena-support:
    judge_settings:
      citation_support_enabled: true
  # Arena conditioned on the frozen, response-independent rubric artifact
  # (qids without a frozen rubric fall back to plain arena prompts).
  rubric-arena:
    judge_settings:
      rubric_arena_enabled: true
  rubric-support-arena:
    judge_settings:
      rubric_arena_enabled: true
      citation_support_enabled: true
  # V2 frozen rubrics (reduced evidence-driven over-specification).
  rubric-v2-support-arena:
    judge_settings:
      rubric_arena_enabled: true
      rubric_path: "rubrics/frozen/rag26-rubrics-v2.jsonl"
      citation_support_enabled: true
  exhaustive-small:
    judge_settings:
      full_round_robin_max_candidates: 999
      adaptive_comparisons_per_topic: 0
  no-reversal:
    judge_settings:
      position_reversal_budget: 0
